<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>

        {% block title %}
        {% endblock %}

    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg,
                    #a8c8f0 0%,
                    #defbfe 50%,
                    #f3d8e4 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: rgba(127, 255, 240, 0.573) !important;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow:
                0 4px 24px rgba(0, 0, 0, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            padding: 15px 25px;
        }

        .navbar-brand {
            color: rgb(0, 0, 0) !important;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 1px;

        }

        .nav-link {
            color: rgb(0, 0, 0) !important;
            font-size: 20px;
            margin-left: 10px;
            transition: 0.2s ease;
        }

        .nav-link:hover {
            transform: scale(1.08);
            color: #060072 !important;
        }

        .active {
            font-weight: bold;
            border-bottom: 5px solid #060072;
        }

        .main-container {
            padding-top: 40px;
            padding-bottom: 40px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            box-shadow:
                0 4px 24px rgba(0, 0, 0, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        h1 {
            color: rgb(0, 0, 0);
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }

        table {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            overflow: hidden;
        }

        th {
            background: rgba(185, 60, 60, 0.25) !important;
            color: rgb(0, 0, 0) !important;
        }

        td {
            color: rgb(0, 0, 0) !important;
            vertical-align: middle;

        }

        tr:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        .form-control,
        .form-select {
            background: rgba(255, 255, 255, 0.20);
            border: none;
            color: rgb(0, 0, 0);
            border-radius: 12px;
            padding: 12px;
        }

        .form-control:focus,
        .form-select:focus {
            background: rgba(255, 255, 255, 0.25);
            color: rgb(0, 0, 0);
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .form-label {
            color: rgb(0, 0, 0);
            font-weight: bold;
        }

        ::placeholder {
            color: rgba(0, 0, 0, 0.7) !important;
        }

        .btn {
            border-radius: 12px;
            transition: 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.10);
        }

        .btn-primary {
            background: rgba(21, 102, 224, 0.7);
            border: none;
        }

        .btn-success {
            background: rgba(25, 135, 84, 0.7);
            border: none;
        }

        .btn-warning {
            background: rgba(255, 193, 7, 0.7);
            border: none;
            color: rgb(0, 0, 0);
        }

        .btn-danger {
            background: rgba(220, 53, 69, 0.7);
            border: none;
        }

        .btn-secondary {
            background: rgba(108, 117, 125, 0.7);
            border: none;
            color: rgb(0, 0, 0);

        }

        /* RESPONSIVE */

        @media(max-width: 768px) {

            .navbar-brand {

                font-size: 18px;

            }

            h1 {

                font-size: 28px;

            }

            .glass-card {

                padding: 20px;

            }

        }
    </style>

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container-fluid">

            <a class="navbar-brand" href="{{ url_for('home') }}">

                Clínica Médica

            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link {{is_active('/medicos/')}}" href="/medicos/">

                            Médicos

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link {{is_active('/pacientes/')}}" href="/pacientes/">

                            Pacientes

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link {{is_active('/consultas/')}}" href="/consultas/">

                            Consultas

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link {{is_active('/citas/')}}" href="/citas/">

                            Citas

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link" href="{{ url_for('home') }}">

                            Inicio

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <div class="container main-container">

        <div class="glass-card">

            {% block content %}
            {% endblock %}

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
