{% extends "base.html" %}

{% block title %} CONSULTAS | CREATE {% endblock %}

{% block content %}

<h1>Registro de consulta</h1>

<form action="{{ url_for('consulta.create') }}" method="POST">

    <div class="mb-3">
        <label class="form-label">Fecha</label>
        <input type="date" class="form-control" name="fecha" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Diagnóstico</label>
        <input type="text" class="form-control" name="diagnostico" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Tratamiento</label>
        <input type="text" class="form-control" name="tratamiento" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Médico</label>

        <select name="id_medico" class="form-select" required>

            <option value="">Seleccione un médico</option>

            {% for item in medicos %}

            <option value="{{ item.id }}">
                {{ item.nombre }} - {{ item.especialidad }}
            </option>

            {% endfor %}

        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Paciente</label>

        <select name="id_paciente" class="form-select" required>

            <option value="">Seleccione un paciente</option>

            {% for item in pacientes %}

            <option value="{{ item.id }}">
                {{ item.nombre }}
            </option>

            {% endfor %}

        </select>
    </div>

    <button type="submit" class="btn btn-primary">
        Registrar consulta
    </button>

</form>

{% endblock %}
