<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}
        {% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body>
    <style>
        body {
            background: linear-gradient(135deg,
                    #a8c8f0 0%,
                    #c9a8f0 50%,
                    #f0a8c8 100%);
            min-height: 100vh;
        }

        .home-container {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

        }

        .buttons-container {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .glass-btn {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 330px;
            height: 330px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 4px 24px rgba(0, 0, 0, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.55),
                0 0 0 1px rgba(255, 255, 255, 0.18);
            transition: 0.2s ease;
        }

        .glass-btn:hover {
            transform: translateY(-5px) scale(1.05);
            background: rgba(255, 255, 255, 0.35);
        }

        .icon svg {
            width: 45px;
            height: 45px;
            stroke: rgba(60, 60, 80, 0.85);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .label {
            font-size: 25px;
            font-weight: bold;
            color: rgba(40, 40, 60, 0.85);
        }

        .titulo {
            margin-bottom: 40px;
            color: rgb(0, 0, 0);
            font-size: 80px;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }

        .icon img {
            width: 150px;
            height: 150px;
            object-fit: contain;

        }
    </style>

    <div class="home-container">
        <h1 class="titulo">
            Clínica Médica
        </h1>
        <div class="buttons-container">
            <a href="{{ url_for('medico.index') }}" class="glass-btn">
                <div class="icon">
                    <img src="/static/medico.jpg" alt="">
                </div>
                <span class="label">
                    Médicos
                </span>
            </a>
            <a href="{{ url_for('paciente.index') }}" class="glass-btn">
                <div class="icon">
                    <img src="/static/paciente.jpg" alt="">
                </div>
                <span class="label">
                    Pacientes
                </span>
            </a>
            <a href="{{ url_for('consulta.index') }}" class="glass-btn">
                <div class="icon">
                    <img src="/static/consulta.jpg" alt="">
                </div>
                <span class="label">
                    Consultas
                </span>
            </a>
            <a href="{{ url_for('cita.index') }}" class="glass-btn">
                <div class="icon">
                    <img src="/static/cita.jpg" alt="">
                </div>
                <span class="label">
                    Citas
                </span>
            </a>
        </div>
    </div>
</body>

</html>
